name: SuperDuckClientGuard
version: '${version}'
main: com.qducks.clientguard.SuperDuckClientGuard
api-version: '1.21.11'
description: Client integrity addon for SuperDuckSystem
authors: [QDucks]
website: https://qducks.com
depend: [SuperDuckSystem]
softdepend: [floodgate, Geyser-Spigot, DuckyPVP, Essentials, HuskHomes]

commands:
  clientguard:
    description: QDucks client integrity administration
    usage: /clientguard <status|scan|reload|strikes|forgive>
    aliases: [cg]
    permission: superduck.clientguard.admin

permissions:
  superduck.clientguard.admin:
    default: op
  superduck.clientguard.alerts:
    default: op
  superduck.clientguard.bypass:
    default: false
