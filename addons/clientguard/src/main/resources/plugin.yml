name: SuperDuckClientGuard
version: '${version}'
main: com.qducks.superduckclientguard.SuperDuckClientGuard
api-version: '1.21'
description: Client/mod policy addon for SuperDuckSystem
authors: [QDucks]
website: https://qducks.com
depend: [SuperDuckSystem]
softdepend: [floodgate]

commands:
  clientguard:
    description: SuperDuck ClientGuard administration
    usage: /clientguard <scan|status|reload> [player]
    aliases: [cg]
    permission: superduck.clientguard.admin

permissions:
  superduck.clientguard.admin:
    default: op
  superduck.clientguard.alerts:
    default: op
  superduck.clientguard.bypass:
    default: op
