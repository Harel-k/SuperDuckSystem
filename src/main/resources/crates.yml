# SuperDuckSystem Crates & Keys configuration
# Keys are DIGITAL. Players earn them from online playtime milestones and other rewards.
# Physical crate models are intentionally not used; crate opening uses inventory/scroll GUIs.

playtime:
  # Completed milestones are permanent. Leaving only resets progress on the current milestone.
  reset-current-progress-on-leave: true
  milestones:
    - key: starter
      minutes: 5
    - key: common
      minutes: 15
    - key: rare
      minutes: 30
    - key: epic
      minutes: 45
    - key: legendary
      minutes: 60
    - key: duck
      minutes: 90

  # After every milestone has been completed, this reward repeats while the player stays online.
  repeat:
    key: common
    minutes: 30

key-menu:
  title: "<gold><bold>Your Keys</bold></gold>"
  rows: 6
  filler:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  progress:
    slot: 49
    material: CLOCK
    name: "<aqua><bold>Playtime Key Progress</bold></aqua>"

crate-menu:
  title: "<gold><bold>Crates</bold></gold>"
  rows: 6
  filler:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  info:
    slot: 49
    material: BOOK
    name: "<aqua><bold>Crate Info</bold></aqua>"

# Used only by crates with opening-style: SCROLL.
scroll:
  title: "<gold><bold>Opening %crate%</bold></gold>"
  rows: 3
  animation-ticks: 60
  step-ticks: 2
  slots: [9, 10, 11, 12, 13, 14, 15, 16, 17]
  filler:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    name: " "

keys:
  starter:
    display-name: "Starter Key"
    slot: 10
    material: WOODEN_SHOVEL
    name: "<green><bold>Starter Key</bold></green>"
    lore:
      - "<gray>Keys:</gray> <white>%amount%</white>"
      - ""
      - "%progress%"
      - "<dark_gray>Designed for a small early-game boost.</dark_gray>"
  common:
    display-name: "Common Key"
    slot: 12
    material: TRIPWIRE_HOOK
    name: "<white><bold>Common Key</bold></white>"
    lore:
      - "<gray>Keys:</gray> <white>%amount%</white>"
      - ""
      - "%progress%"
  rare:
    display-name: "Rare Key"
    slot: 14
    material: LAPIS_LAZULI
    name: "<blue><bold>Rare Key</bold></blue>"
    lore:
      - "<gray>Keys:</gray> <white>%amount%</white>"
      - ""
      - "%progress%"
  epic:
    display-name: "Epic Key"
    slot: 16
    material: AMETHYST_SHARD
    name: "<light_purple><bold>Epic Key</bold></light_purple>"
    lore:
      - "<gray>Keys:</gray> <white>%amount%</white>"
      - ""
      - "%progress%"
  legendary:
    display-name: "Legendary Key"
    slot: 30
    material: GOLD_INGOT
    name: "<gold><bold>Legendary Key</bold></gold>"
    lore:
      - "<gray>Keys:</gray> <white>%amount%</white>"
      - ""
      - "%progress%"
  duck:
    display-name: "Duck Key"
    slot: 32
    material: FEATHER
    name: "<yellow><bold>Duck Key</bold></yellow>"
    lore:
      - "<gray>Keys:</gray> <white>%amount%</white>"
      - ""
      - "%progress%"
      - "<yellow>Special QDucks crate.</yellow>"

# Loot pools are deliberately conservative defaults and are fully editable.
