# SuperDuckSystem main configuration
# Gameplay values live in dedicated config files so the plugin stays easy to customize.

server:
  name: "QDucks SMP"

modules:
  economy: true
  shop: true
  auctions: true
  orders: true
  crates: true
  settings: true
  custom-tools: false

database:
  type: SQLITE
  file: data.db
  wal: true

integrations:
  placeholderapi: true
  floodgate: true
  luckperms: true
  vaultunlocked: true

# Rank perk values are fully configurable. The LuckPerms primary group is used when LuckPerms is available.
# These are converted into the same numeric permissions used by the AH and Orders systems.
rank-perks:
  default:
    auction-slots: 3
    order-slots: 3
  duckplus:
    auction-slots: 9
    order-slots: 9
  duckplusplus:
    auction-slots: 20
    order-slots: 20
  duckplusplusplus:
    auction-slots: 45
    order-slots: 45
  staff:
    auction-slots: 45
    order-slots: 45
  helper:
    auction-slots: 45
    order-slots: 45
  moderator:
    auction-slots: 50
    order-slots: 50
  admin:
    auction-slots: 60
    order-slots: 60
  developer:
    auction-slots: 75
    order-slots: 75
  owner:
    auction-slots: 100
    order-slots: 100

custom-tools:
  duck-pickaxe:
    area-width: 3
    area-height: 3
    depth: 1
  duck-shovel:
    area-width: 3
    area-height: 3
    depth: 1
  duck-axe:
    tree-vein-enabled: true
    max-blocks: 256

messages:
  prefix: "<aqua><bold>%server_name%</bold></aqua> <dark_gray>»</dark_gray> "
