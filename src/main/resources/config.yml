# SuperDuckSystem main configuration
# Gameplay values live in dedicated config files so the plugin stays easy to customize.

server:
  name: "QDucks SMP"

modules:
  economy: true
  shop: true
  auctions: true
  orders: true
  crates: true
  settings: true
  custom-tools: true

database:
  type: SQLITE
  file: data.db
  wal: true

integrations:
  placeholderapi: true
  floodgate: true
  luckperms: true
  vaultunlocked: true

# Rank perk values are fully configurable. The LuckPerms primary group is used when LuckPerms is available.
# Market personal GUIs currently expose 45 slots, so staff is capped at 45 until paged personal menus are added.
rank-perks:
  default:
    auction-slots: 3
    order-slots: 3
  duckplus:
    auction-slots: 9
    order-slots: 9
  duckplusplus:
    auction-slots: 20
    order-slots: 20
  duckplusplusplus:
    auction-slots: 45
    order-slots: 45
  staff:
    auction-slots: 45
    order-slots: 45
  helper:
    auction-slots: 45
    order-slots: 45
  moderator:
    auction-slots: 45
    order-slots: 45
  admin:
    auction-slots: 45
    order-slots: 45
  developer:
    auction-slots: 45
    order-slots: 45
  owner:
    auction-slots: 45
    order-slots: 45

# Duck Pickaxe/Shovel/Axe definitions and behavior live in custom-items.yml.

messages:
  prefix: "<aqua><bold>%server_name%</bold></aqua> <dark_gray>»</dark_gray> "
