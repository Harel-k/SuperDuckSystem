# SuperDuckSystem main configuration
# Gameplay values live in dedicated config files so the plugin stays easy to customize.

server:
  name: "QDucks SMP"

modules:
  economy: true
  shop: true
  auctions: true
  orders: true
  crates: false
  settings: true
  custom-tools: false

database:
  type: SQLITE
  file: data.db
  wal: true

integrations:
  placeholderapi: true
  floodgate: true
  luckperms: true
  vaultunlocked: true

custom-tools:
  duck-pickaxe:
    area-width: 3
    area-height: 3
    depth: 1
  duck-shovel:
    area-width: 3
    area-height: 3
    depth: 1
  duck-axe:
    tree-vein-enabled: true
    max-blocks: 256

messages:
  prefix: "<aqua><bold>%server_name%</bold></aqua> <dark_gray>»</dark_gray> "
