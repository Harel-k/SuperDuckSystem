# Global SuperDuckSystem GUI defaults.
# Individual gameplay modules will have their own GUI sections/files as they are built.

style:
  filler:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  back:
    material: ARROW
    name: "<yellow>Back</yellow>"
  previous-page:
    material: ARROW
    name: "<aqua>Previous Page</aqua>"
  next-page:
    material: ARROW
    name: "<aqua>Next Page</aqua>"
  refresh:
    material: CLOCK
    name: "<green>Refresh</green>"
  search:
    material: OAK_SIGN
    name: "<yellow>Search</yellow>"
  confirm:
    material: LIME_CONCRETE
    name: "<green><bold>CONFIRM</bold></green>"
  cancel:
    material: RED_CONCRETE
    name: "<red><bold>CANCEL</bold></red>"

sounds:
  click: UI_BUTTON_CLICK
  success: ENTITY_PLAYER_LEVELUP
  error: ENTITY_VILLAGER_NO
