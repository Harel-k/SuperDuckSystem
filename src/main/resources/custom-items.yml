# SuperDuckSystem custom items and Duck tool configuration
# Everything here can be changed without recompiling the plugin.

items:
  duck_pickaxe:
    material: DIAMOND_PICKAXE
    name: "<aqua><bold>Duck Pickaxe</bold></aqua>"
    lore:
      - "<gray>Mines a <white>9x9</white> area.</gray>"
      - "<dark_gray>SuperDuck item</dark_gray>"
    enchantments:
      efficiency: 5
      unbreaking: 3
    unbreakable: false

  duck_shovel:
    material: DIAMOND_SHOVEL
    name: "<yellow><bold>Duck Shovel</bold></yellow>"
    lore:
      - "<gray>Digs a <white>9x9</white> area.</gray>"
      - "<dark_gray>SuperDuck item</dark_gray>"
    enchantments:
      efficiency: 5
      unbreaking: 3
    unbreakable: false

  duck_axe:
    material: DIAMOND_AXE
    name: "<green><bold>Duck Axe</bold></green>"
    lore:
      - "<gray>Fells the full connected tree vein.</gray>"
      - "<dark_gray>SuperDuck item</dark_gray>"
    enchantments:
      efficiency: 5
      unbreaking: 3
    unbreakable: false

tools:
  duck_pickaxe:
    enabled: true
    # Odd sizes from 1-9 are supported. QDucks SMP defaults to 9x9.
    width: 9
    height: 9
    depth: 1
    max-extra-blocks: 80
    # Empty = automatically allow normal pickaxe-style solid blocks while excluding containers,
    # liquids, logs/leaves and the blocked list below.
    allowed-blocks: []
    blocked-blocks:
      - BEDROCK
      - BARRIER
      - END_PORTAL_FRAME

  duck_shovel:
    enabled: true
    # Odd sizes from 1-9 are supported. QDucks SMP defaults to 9x9.
    width: 9
    height: 9
    depth: 1
    max-extra-blocks: 80
    # Empty = automatically allow dirt/sand/gravel/snow/clay style blocks.
    allowed-blocks: []
    blocked-blocks:
      - BEDROCK
      - BARRIER

  duck_axe:
    enabled: true
    tree-vein-enabled: true
    # Safety caps are intentionally configurable. These defaults are high enough for full
    # vanilla tree veins while still preventing an accidental unbounded log-structure wipe.
    max-blocks: 2048
    max-radius: 32
    connect-diagonally: true
    include-wood-blocks: true
    include-stems: true
    # Empty = automatically include logs plus the enabled wood/stem types above.
    allowed-blocks: []

safety:
  # Extra blocks are broken through Player#breakBlock, so WorldGuard/CoreProtect/other
  # BlockBreakEvent protection plugins get a chance to cancel every individual block.
  respect-block-break-events: true
