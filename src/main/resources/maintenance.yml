# Full-server QDucks maintenance mode.
# This is separate from /sds maintenance <module> <on|off>.
#
# /maintenancemode or /mm toggles the mode.
# /mm on|off|status|setroom|reload|debug are also available.

# Saved automatically when /mm is toggled, so maintenance survives restarts.
active: false

room:
  world: spawn
  x: 0.5
  y: 100.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

whitelist:
  # This permission must be granted explicitly, for example with LuckPerms.
  # OP/admin status alone does NOT bypass maintenance.
  permission: superduck.maintenance.whitelist

  # Names are case-insensitive. UUIDs are also accepted.
  players: []

# Only these commands can be used by restricted players.
# Do not include the leading slash.
allowed-commands:
  - msg
  - tell
  - w
  - whisper
  - r
  - reply
  - help
  - rules
  - discord
  - list
  - ping

restrictions:
  force-adventure: true

ui:
  bossbar:
    enabled: true
    text: "<gold><bold>Server in Maintenance</bold></gold>"
    color: YELLOW
    overlay: PROGRESS

  actionbar:
    enabled: true
    text: "<yellow><bold>Please Be Patient</bold></yellow>"

messages:
  join: "<yellow>The server is currently in maintenance mode. You can stay here while we work on it.</yellow>"
  command-blocked: "<red>You cannot use that command while the server is in maintenance mode.</red>"
  title: "<gold><bold>MAINTENANCE</bold></gold>"
  subtitle: "<gray>QDucks is being worked on. Please wait here.</gray>"
