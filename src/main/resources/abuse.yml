# QDucks Abuse Mode
# Separates an owner's/admin's LEGIT survival state from their ADMIN state.

abuse-mode:
  # Used the first time an admin profile is created.
  default-gamemode: CREATIVE

  # Prevents admin-profile items from leaking into normal survival containers/world drops.
  prevent-world-item-transfer: true

  # Runtime bypasses while Abuse Mode is ON.
  # Grim/Boar entries are harmless until those anti-cheats are installed.
  bypass-permissions:
    - superduck.combat.bypass
    - duckypvp.combat.bypass
    - grim.disabled
    - boar.exempt

  # Commands that could move admin-profile resources into the legit economy/world.
  blocked-transfer-commands:
    - pay
    - sell
    - ah
    - auctionhouse
    - order
    - orders
    - trade
    - qs
    - quickshop

legit-mode:
  # These are blocked for managed staff while Abuse Mode is OFF, even if OP/LuckPerms grants them.
  # Normal player commands such as /home, /spawn, /rtp, /tpa, /shop, etc. stay usable.
  blocked-commands:
    - give
    - gamemode
    - gmc
    - gms
    - gma
    - gmsp
