# SuperDuckSystem messages
# MiniMessage formatting is supported. Placeholders wrapped in %...% are filled by the plugin.

help:
  header: "<aqua><bold>SuperDuckSystem</bold></aqua> <gray>v%version%</gray>"
  line: "<gray>Use <white>/%label% status</white> to view system status.</gray>"

errors:
  no-permission: "<red>You do not have permission to do that.</red>"
  unknown-subcommand: "<red>Unknown subcommand.</red>"
  players-only: "<red>This command can only be used by players.</red>"
  player-not-online: "<red>That player is not online.</red>"
  player-never-joined: "<red>That player has never joined the server.</red>"
  invalid-amount: "<red>That is not a valid amount.</red>"
  amount-required: "<red>You must provide an amount.</red>"
  database: "<red>Could not load that right now.</red>"

admin:
  reloaded: "<green>SuperDuckSystem configuration reloaded.</green>"
  status-header: "<aqua><bold>SuperDuckSystem</bold></aqua> <gray>Status</gray>"

economy:
  balance-usage: "<red>Usage: /balance <player></red>"
  balance: "<gray>Balance:</gray> <green>%balance%</green>"
  balance-other: "<white>%player%</white><gray>'s balance:</gray> <green>%balance%</green>"
  baltop-header: "<aqua><bold>Top Balances</bold></aqua>"
  baltop-line: "<yellow>#%rank%</yellow> <white>%player%</white> <gray>-</gray> <green>%balance%</green>"
  baltop-empty: "<gray>No balances to display yet.</gray>"
  pay-usage: "<red>Usage: /pay <player> <amount></red>"
  pay-disabled: "<red>Player payments are currently disabled.</red>"
  pay-self: "<red>You cannot pay yourself.</red>"
  pay-range: "<red>Payment must be between %minimum% and %maximum%.</red>"
  paid: "<green>You paid <white>%player%</white> %amount%.</green>"
  received: "<green>You received %amount% from <white>%player%</white>.</green>"
  insufficient: "<red>You do not have enough money.</red>"
  failed: "<red>Payment failed.</red>"
  admin-usage: "<red>Usage: /eco <give|take|set|reset> <player> [amount] [money|ducks]</red>"
  admin-unknown: "<red>Unknown action. Use give, take, set or reset.</red>"
  admin-failed: "<red>Economy action failed.</red>"
  admin-success: "<green>%action% completed for <white>%player%</white>. New balance: %balance%</green>"

ducks:
  usage: "<red>Usage: /ducks <player></red>"
  balance: "<gray>Ducks:</gray> <yellow>%ducks%</yellow>"
  balance-other: "<white>%player%</white><gray>'s Ducks:</gray> <yellow>%ducks%</yellow>"

settings:
  saved: "<green>Your settings were saved.</green>"
  failed: "<red>Could not save your settings.</red>"

shop:
  empty: "<gray>The shop has no configured categories.</gray>"
  category-empty: "<gray>That category is empty.</gray>"
  insufficient: "<red>You do not have enough money for that purchase.</red>"
  failed: "<red>The purchase failed.</red>"
  bought: "<green>Bought <white>%amount%x %item%</white> for %price%.</green>"

sell:
  nothing: "<red>There are no sellable items in the menu.</red>"
  failed: "<red>The sale failed, so your items were returned.</red>"
  success: "<green>Sold <white>%items%</white> items for %amount%.</green>"

auction:
  load-failed: "<red>Could not load the Auction House.</red>"
  search-hint: "<yellow>Search with <white>/ah &lt;item&gt;</white> for now.</yellow>"
  sell-usage: "<red>Usage: /ah sell <price></red>"
  hold-item: "<red>Hold the item you want to sell in your main hand.</red>"
  item-changed: "<red>Your held item changed. Run /ah sell again.</red>"
  own-item: "<red>You cannot buy your own auction.</red>"
  slot-limit: "<red>You are using all %limit% of your auction slots.</red>"
  price-range: "<red>Price must be between %minimum% and %maximum%.</red>"
  list-failed: "<red>Could not list the item, so it was returned.</red>"
  listed: "<green>Listed your item for %price%.</green>"
  insufficient: "<red>You do not have enough money.</red>"
  unavailable: "<red>That auction is no longer available.</red>"
  buy-failed: "<red>The purchase failed.</red>"
  bought: "<green>Purchased the auction for %price%.</green>"
  sold-notification: "<green>Your auction sold for %price%.</green>"
  cancel-failed: "<red>Could not cancel that auction.</red>"
  cancelled: "<green>Auction cancelled. The item is now in My Items.</green>"
  claim-failed: "<yellow>Your item is still waiting in My Items. Open /ah and try again.</yellow>"
  claimed: "<green>Claimed your auction item.</green>"
