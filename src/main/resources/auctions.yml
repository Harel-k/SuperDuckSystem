    - 43
    - 44
  empty-slot:
    material: LIME_STAINED_GLASS_PANE
    name: "<green><bold>+ List Item</bold></green>"
    lore:
      - "<gray>Used slots:</gray> <white>%used%/%limit%</white>"
      - "<yellow>Click to choose an item from your inventory.</yellow>"
  back:
    slot: 49
    material: BARRIER
    name: "<red>Back</red>"
