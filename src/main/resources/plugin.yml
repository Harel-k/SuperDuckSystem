name: SuperDuckSystem
version: '${version}'
main: com.qducks.superducksystem.SuperDuckSystem
api-version: '1.21.11'
description: Custom gameplay systems for QDucks SMP
authors: [QDucks]
website: https://qducks.com
softdepend: [PlaceholderAPI, floodgate, LuckPerms, VaultUnlocked]

commands:
  superduck:
    description: SuperDuckSystem help and administration
    usage: /superduck
    aliases: [sds]
    permission: superduck.command
  balance:
    description: View your money balance
    usage: /balance [player]
    aliases: [bal, money]
    permission: superduck.balance
  baltop:
    description: View the richest players
    usage: /baltop
    permission: superduck.baltop
  ducks:
    description: View your Ducks currency
    usage: /ducks [player]
    permission: superduck.ducks
  pay:
    description: Pay another online player
    usage: /pay <player> <amount>
    permission: superduck.pay
  eco:
    description: SuperDuckSystem economy administration
    usage: /eco <give|take|set|reset> <player> [amount] [money|ducks]
    aliases: [economy]
    permission: superduck.admin.economy
  settings:
    description: Open your player settings
    usage: /settings
    permission: superduck.settings
  shop:
    description: Open the server shop
    usage: /shop
    permission: superduck.shop
  sell:
    description: Open the sell menu
    usage: /sell
    permission: superduck.sell
  auctionhouse:
    description: Open and use the Auction House
    usage: /ah [search] or /ah sell <price>
    aliases: [ah]
    permission: superduck.auction
  order:
    description: Open and use Buy Orders
    usage: /order [search] or /order create
    aliases: [orders]
    permission: superduck.order
  key:
    description: View your keys and online key progress
    usage: /key
    aliases: [keys]
    permission: superduck.key
  crates:
    description: Browse, preview and open crates
    usage: /crates [crate] or /crates preview <crate>
    aliases: [crate]
    permission: superduck.crates
  stats:
    description: View player statistics
    usage: /stats [player]
    permission: superduck.stats
  leaderboard:
    description: View SuperDuck leaderboards
    usage: /leaderboard [money|ducks|kills|playtime|crates]
    aliases: [lb, top]
    permission: superduck.leaderboard
  daily:
    description: Claim your daily reward
    usage: /daily
    permission: superduck.daily
  rewards:
    description: Open your playtime rewards
    usage: /rewards
    aliases: [playtimerewards]
    permission: superduck.rewards

permissions:
  superduck.command:
    default: true
  superduck.balance:
    default: true
  superduck.balance.others:
    default: op
  superduck.baltop:
    default: true
  superduck.ducks:
    default: true
  superduck.ducks.others:
    default: op
  superduck.pay:
    default: true
  superduck.settings:
    default: true
  superduck.shop:
    default: true
  superduck.sell:
    default: true
  superduck.auction:
    default: true
  superduck.auction.slots.3:
    default: true
  superduck.order:
    default: true
  superduck.order.slots.3:
    default: true
  superduck.key:
    default: true
  superduck.crates:
    default: true
  superduck.stats:
    default: true
  superduck.leaderboard:
    default: true
  superduck.daily:
    default: true
  superduck.rewards:
    default: true
  superduck.admin.keys:
    default: op
  superduck.admin.items:
    default: op
  superduck.admin.economy:
    default: op
  superduck.admin.status:
    default: op
  superduck.admin.reload:
    default: op
