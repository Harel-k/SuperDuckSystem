name: Apply Crate Lock Patch

on:
  push:
    branches: [dev]
    paths:
      - 'tools/apply-crate-lock.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: dev
      - name: Apply patch
        run: python3 tools/apply-crate-lock.py
      - name: Validate patch
        run: git diff --check
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java
          git commit -m "fix: prevent overlapping crate opens and disconnect rerolls"
          git push origin HEAD:dev
