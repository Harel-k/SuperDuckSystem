name: Build SuperDuckSystem

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: write

concurrency:
  group: superduck-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Build
        run: gradle clean build --stacktrace

      - name: Verify shaded runtime
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'SuperDuckSystem-*.jar' ! -name '*plain*' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          if [ -z "$JAR" ]; then
            echo "Shaded plugin jar is missing."
            ls -lah build/libs || true
            exit 1
          fi
          jar tf "$JAR" | grep -qx 'plugin.yml'
          jar tf "$JAR" | grep -qx 'org/sqlite/JDBC.class'
          echo "Verified plugin.yml and bundled SQLite JDBC driver in $JAR"

      - name: Verify ClientGuard addon
        shell: bash
        run: |
          set -euo pipefail
          ADDON_JAR="$(find addons/clientguard/build/libs -maxdepth 1 -type f -name 'SuperDuckClientGuard-*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          if [ -z "$ADDON_JAR" ]; then
            echo "SuperDuckClientGuard jar is missing."
            ls -lah addons/clientguard/build/libs || true
            exit 1
          fi
          jar tf "$ADDON_JAR" | grep -qx 'plugin.yml'
          echo "Verified ClientGuard plugin.yml in $ADDON_JAR"

      - name: Prepare easy-download jars
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'SuperDuckSystem-*.jar' ! -name '*plain*' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          ADDON_JAR="$(find addons/clientguard/build/libs -maxdepth 1 -type f -name 'SuperDuckClientGuard-*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          if [ -z "$JAR" ] || [ -z "$ADDON_JAR" ]; then
            echo "Could not find one or more plugin jars."
            ls -lah build/libs || true
            ls -lah addons/clientguard/build/libs || true
            exit 1
          fi
          cp "$JAR" build/libs/SuperDuckSystem.jar
          cp "$ADDON_JAR" build/libs/SuperDuckClientGuard.jar

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperDuckSystem-latest
          path: build/libs/SuperDuckSystem.jar

      - name: Upload ClientGuard artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperDuckClientGuard-latest
          path: build/libs/SuperDuckClientGuard.jar

      - name: Publish latest dev jar
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Keep the stable tag pinned to the exact commit that produced this jar.
          git tag -f dev-latest "$GITHUB_SHA"
          git push origin refs/tags/dev-latest --force

          TITLE="SuperDuckSystem - Latest Dev Build"
          NOTES="Automatically built from the latest successful dev commit. SuperDuckSystem.jar is the core plugin; SuperDuckClientGuard.jar is the optional client-integrity addon and requires SuperDuckSystem."

          # Find the release through the releases collection so this also finds and
          # repairs a draft/orphaned dev-latest release left by an interrupted run.
          RELEASE_ID="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "dev-latest") | .id' | head -n 1)"

          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name='dev-latest' \
              -f name="$TITLE" \
              -f body="$NOTES" \
              -F draft=false \
              -F prerelease=false \
              --jq '.id')"
          else
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -f tag_name='dev-latest' \
              -f name="$TITLE" \
              -f body="$NOTES" \
              -F draft=false \
              -F prerelease=false >/dev/null
          fi

          # Publish each stable asset transactionally: upload a unique temporary
          # asset first, confirm it exists, then replace only that asset's old
          # stable name. A failure cannot erase the previously working download.
          publish_asset() {
            local source_path="$1"
            local stable_name="$2"
            local temp_name="${stable_name%.jar}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jar"

            cp "$source_path" "/tmp/$temp_name"
            gh release upload dev-latest "/tmp/$temp_name" --repo "$GITHUB_REPOSITORY"

            local new_asset_id
            new_asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
              --jq ".[] | select(.name == \"$temp_name\") | .id" | head -n 1)"
            if [ -z "$new_asset_id" ]; then
              echo "Uploaded $stable_name asset could not be found. Keeping the previous stable asset."
              exit 1
            fi

            while IFS= read -r old_asset_id; do
              [ -z "$old_asset_id" ] && continue
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old_asset_id"
            done < <(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
              --jq ".[] | select(.name == \"$stable_name\") | .id")

            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$new_asset_id" \
              -f name="$stable_name" >/dev/null
          }

          publish_asset build/libs/SuperDuckSystem.jar SuperDuckSystem.jar
          publish_asset build/libs/SuperDuckClientGuard.jar SuperDuckClientGuard.jar

          echo "Published SuperDuckSystem.jar and SuperDuckClientGuard.jar from $GITHUB_SHA"
