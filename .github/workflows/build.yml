name: Build SuperDuckSystem

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: write

concurrency:
  group: superduck-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Build
        run: gradle clean build --stacktrace

      - name: Verify shaded runtime
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'SuperDuckSystem-*.jar' ! -name '*plain*' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          if [ -z "$JAR" ]; then
            echo "Shaded plugin jar is missing."
            ls -lah build/libs || true
            exit 1
          fi
          jar tf "$JAR" | grep -qx 'plugin.yml'
          jar tf "$JAR" | grep -qx 'org/sqlite/JDBC.class'
          echo "Verified plugin.yml and bundled SQLite JDBC driver in $JAR"

      - name: Prepare easy-download jar
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'SuperDuckSystem-*.jar' ! -name '*plain*' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          if [ -z "$JAR" ]; then
            echo "Could not find the shaded SuperDuckSystem jar."
            ls -lah build/libs || true
            exit 1
          fi
          cp "$JAR" build/libs/SuperDuckSystem.jar

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperDuckSystem-latest
          path: build/libs/SuperDuckSystem.jar

      - name: Publish latest dev jar
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Keep the stable tag pinned to the exact commit that produced this jar.
          git tag -f dev-latest "$GITHUB_SHA"
          git push origin refs/tags/dev-latest --force

          TITLE="SuperDuckSystem - Latest Dev Build"
          NOTES="Automatically built from the latest successful dev commit. Download SuperDuckSystem.jar below and upload it to the server's plugins folder."

          # Find the release through the releases collection so this also finds and
          # repairs a draft/orphaned dev-latest release left by an interrupted run.
          RELEASE_ID="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "dev-latest") | .id' | head -n 1)"

          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name='dev-latest' \
              -f name="$TITLE" \
              -f body="$NOTES" \
              -F draft=false \
              -F prerelease=false \
              --jq '.id')"
          else
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -f tag_name='dev-latest' \
              -f name="$TITLE" \
              -f body="$NOTES" \
              -F draft=false \
              -F prerelease=false >/dev/null
          fi

          # Upload under a unique temporary name first. Only after the upload is
          # confirmed do we remove the previous stable asset and rename this one.
          # That prevents a failed upload from leaving dev-latest with no jar.
          TEMP_NAME="SuperDuckSystem-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jar"
          cp build/libs/SuperDuckSystem.jar "/tmp/$TEMP_NAME"
          gh release upload dev-latest "/tmp/$TEMP_NAME" --repo "$GITHUB_REPOSITORY"

          NEW_ASSET_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq ".[] | select(.name == \"$TEMP_NAME\") | .id" | head -n 1)"
          if [ -z "$NEW_ASSET_ID" ]; then
            echo "Uploaded asset could not be found. Refusing to replace the stable jar."
            exit 1
          fi

          while IFS= read -r OLD_ASSET_ID; do
            [ -z "$OLD_ASSET_ID" ] && continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$OLD_ASSET_ID"
          done < <(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name == "SuperDuckSystem.jar") | .id')

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$NEW_ASSET_ID" \
            -f name='SuperDuckSystem.jar' >/dev/null

          echo "Published dev-latest from $GITHUB_SHA"
